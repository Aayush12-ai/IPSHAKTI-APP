openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mobile
    description: Mobile app operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /mobile/chat:
    post:
      operationId: mobileChat
      tags: [mobile]
      summary: Ask IP SAKTI
      description: Sends a mobile user's IP question to the server-side AI assistant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileChatRequest"
      responses:
        "200":
          description: AI assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileChatResult"
        "400":
          description: Invalid question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AI provider failed to return a response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI service is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mobile/formula-analysis:
    post:
      operationId: mobileFormulaAnalysis
      tags: [mobile]
      summary: Analyze an Ayurveda formulation
      description: Extracts and normalizes recognized ingredients, then returns only evidence-backed analysis available to the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileFormulaAnalysisRequest"
      responses:
        "200":
          description: Structured formulation analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileFormulaAnalysisResult"
        "400":
          description: Invalid formulation input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Analysis provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mobile/projects:
    get:
      operationId: mobileProjects
      tags: [mobile]
      summary: List research projects
      description: Lists the mobile user's research projects and recent activity.
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Research projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileProjectsResult"
        "400":
          description: Invalid client identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: mobileProjectCreate
      tags: [mobile]
      summary: Create a research project
      description: Creates a research project for the mobile user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileProjectCreateRequest"
      responses:
        "201":
          description: Research project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileProjectResult"
        "400":
          description: Invalid project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mobile/projects/{projectId}/memories:
    post:
      operationId: mobileMemoryCreate
      tags: [mobile]
      summary: Save a research finding
      description: Saves an explainable finding and optional source metadata to a research project.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileMemoryCreateRequest"
      responses:
        "201":
          description: Saved research memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileMemoryResult"
        "400":
          description: Invalid memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mobile/classify:
    post:
      operationId: mobileClassify
      tags: [mobile]
      summary: Classify an Ayurvedic product
      description: Evaluates an Ayurvedic formulation, method, and claims under Indian and international regulatory frameworks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileClassifyRequest"
      responses:
        "200":
          description: Product classification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileClassifyResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Classification provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mobile/abs-check:
    post:
      operationId: mobileAbsCheck
      tags: [mobile]
      summary: Check Access and Benefit Sharing (ABS) obligations
      description: Assesses biodiversity compliance and ABS obligations under the Biological Diversity Act 2002 and 2023 Amendments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileAbsCheckRequest"
      responses:
        "200":
          description: ABS assessment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileAbsCheckResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: ABS analysis provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MobileChatRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
        clientId:
          type: string
          minLength: 1
          maxLength: 120
        projectId:
          type: string
        sessionId:
          type: string
      required:
        - question
        - clientId
    MobileChatResult:
      type: object
      properties:
        answer:
          type: string
        projectId:
          type: string
        sessionId:
          type: string
        historyId:
          type: string
      required:
        - answer
        - projectId
        - sessionId
        - historyId
    MobileFormulaAnalysisRequest:
      type: object
      properties:
        formulation:
          type: string
          minLength: 1
          maxLength: 4000
        action:
          type: string
          enum: [full, prior-art, abs-tk]
      required:
        - formulation
        - action
    FormulaIngredient:
      type: object
      properties:
        input:
          type: string
        commonName:
          type: string
        botanicalName:
          type: string
        normalizedEntity:
          type: string
        source:
          type: string
        status:
          type: string
          enum: [recognized, unrecognized]
      required:
        - input
        - commonName
        - botanicalName
        - normalizedEntity
        - source
        - status
    FormulaEvidence:
      type: object
      properties:
        title:
          type: string
        reference:
          type: string
        url:
          type: string
      required:
        - title
        - reference
    FormulaAnalysisSection:
      type: object
      properties:
        status:
          type: string
          enum: [available, unavailable, not-run]
        summary:
          type: string
        findings:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/FormulaEvidence"
      required:
        - status
        - summary
        - findings
        - evidence
    MobileFormulaAnalysisResult:
      type: object
      properties:
        formulation:
          type: string
        representation:
          type: string
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/FormulaIngredient"
        patent:
          $ref: "#/components/schemas/FormulaAnalysisSection"
        priorArt:
          $ref: "#/components/schemas/FormulaAnalysisSection"
        traditionalKnowledge:
          $ref: "#/components/schemas/FormulaAnalysisSection"
        abs:
          $ref: "#/components/schemas/FormulaAnalysisSection"
        regulatory:
          $ref: "#/components/schemas/FormulaAnalysisSection"
        explanation:
          type: string
        explanationStatus:
          type: string
          enum: [available, unavailable]
      required:
        - formulation
        - representation
        - ingredients
        - patent
        - priorArt
        - traditionalKnowledge
        - abs
        - regulatory
        - explanation
        - explanationStatus
    ResearchSourceMetadata:
      type: object
      properties:
        title:
          type: string
        reference:
          type: string
        url:
          type: string
      required:
        - title
        - reference
    ResearchHistorySummary:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - question
        - createdAt
    MobileProjectResult:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        analysisCount:
          type: number
        sourceCount:
          type: number
        lastActivityAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        recentResearch:
          type: array
          items:
            $ref: "#/components/schemas/ResearchHistorySummary"
      required:
        - id
        - name
        - description
        - analysisCount
        - sourceCount
        - lastActivityAt
        - createdAt
        - updatedAt
        - recentResearch
    MobileProjectsResult:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/MobileProjectResult"
      required:
        - projects
    MobileProjectCreateRequest:
      type: object
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 1000
      required:
        - clientId
        - name
    MobileMemoryCreateRequest:
      type: object
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 120
        title:
          type: string
          minLength: 1
          maxLength: 160
        finding:
          type: string
          minLength: 1
          maxLength: 8000
        entities:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ResearchSourceMetadata"
      required:
        - clientId
        - title
        - finding
    MobileMemoryResult:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        finding:
          type: string
        savedAt:
          type: string
          format: date-time
        sourceCount:
          type: number
      required:
        - id
        - title
        - finding
        - savedAt
        - sourceCount
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    MobileClassifyRequest:
      type: object
      properties:
        productName:
          type: string
          minLength: 1
          maxLength: 300
        ingredients:
          type: string
          minLength: 1
          maxLength: 3000
        dosageForm:
          type: string
        preparationMethod:
          type: string
        intendedUse:
          type: string
        claims:
          type: string
        targetMarket:
          type: string
        clientId:
          type: string
        projectId:
          type: string
      required:
        - productName
        - ingredients
    MobileClassifyResult:
      type: object
      properties:
        category:
          type: string
        categoryCode:
          type: string
        confidence:
          type: string
        confidenceScore:
          type: number
        summary:
          type: string
        statutoryBasis:
          type: string
        regulatoryPathway:
          type: object
          properties:
            authority:
              type: string
            licenseType:
              type: string
            trialRequirements:
              type: array
              items:
                type: string
            standardsRef:
              type: string
          required:
            - authority
            - licenseType
            - trialRequirements
            - standardsRef
        ipAndTkdlRisks:
          type: object
          properties:
            patentability:
              type: string
            tkdlOverlap:
              type: string
            keyRisks:
              type: array
              items:
                type: string
          required:
            - patentability
            - tkdlOverlap
            - keyRisks
        recommendedActions:
          type: array
          items:
            type: string
        evidenceSources:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              section:
                type: string
              description:
                type: string
            required:
              - title
              - section
              - description
      required:
        - category
        - categoryCode
        - confidence
        - confidenceScore
        - summary
        - statutoryBasis
        - regulatoryPathway
        - ipAndTkdlRisks
        - recommendedActions
        - evidenceSources
    MobileAbsCheckRequest:
      type: object
      properties:
        entityType:
          type: string
        bioResources:
          type: string
          minLength: 1
          maxLength: 3000
        sourcingType:
          type: string
        activityType:
          type: string
        jurisdiction:
          type: string
        clientId:
          type: string
        projectId:
          type: string
      required:
        - entityType
        - bioResources
        - sourcingType
        - activityType
    MobileAbsCheckResult:
      type: object
      properties:
        absStatus:
          type: string
        statusTitle:
          type: string
        confidence:
          type: string
        summary:
          type: string
        statutorySections:
          type: array
          items:
            type: string
        benefitSharingEstimate:
          type: string
        approvalForms:
          type: array
          items:
            type: string
        keyObligations:
          type: array
          items:
            type: string
        exemptionsApplicable:
          type: array
          items:
            type: string
        patentClearanceAdvice:
          type: string
        stepByStepRoadmap:
          type: array
          items:
            type: string
        evidenceSources:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              section:
                type: string
              description:
                type: string
            required:
              - title
              - section
              - description
      required:
        - absStatus
        - statusTitle
        - confidence
        - summary
        - statutorySections
        - benefitSharingEstimate
        - approvalForms
        - keyObligations
        - exemptionsApplicable
        - patentClearanceAdvice
        - stepByStepRoadmap
        - evidenceSources


